name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build
      - name: Pruebas (Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
        env:
          CHROME_BIN: /usr/bin/google-chrome
