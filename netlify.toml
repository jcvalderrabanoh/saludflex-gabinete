# Sistema Integral de Gabinete en Netlify (igual que lumen-view / core-front).
[build]
  command = "npm ci && npx ng build"
  publish = "dist/saludflex-gabinete/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA: toda ruta la resuelve Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
